[project]
name = "perdedor"
version = "2.0.1"
description = "PERDEDOR: cross-platform sandbox-evasion self-test suite for CHIMERA (Windows, Linux, Android)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "black==26.10.1", "isort==9.0.2", "ruff==0.17.4"]

[project.scripts]
perdedor = "perdedor_cli.__main__:main"
perdedor-macos = "perdedor_macos.__main__:main"
perdedor-ios = "perdedor_ios.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "perdedor_common" = "common/python/perdedor_common", "perdedor_linux" = "agents/linux/perdedor_linux", "perdedor_android" = "agents/android/perdedor_android", "perdedor_cli" = "cli/perdedor_cli", "perdedor_macos" = "agents/macos/perdedor_macos", "perdedor_ios" = "agents/ios/perdedor_ios" }
packages = ["perdedor_common", "perdedor_linux", "perdedor_android", "perdedor_cli", "perdedor_macos", "perdedor_macos.checks", "perdedor_ios", "perdedor_ios.checks"]

[tool.setuptools.package-data]
# Filled by scripts/build_dist.sh just before building; absent in a checkout.
perdedor_common = ["_catalog/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Correctness rules only: pyflakes, syntax/statement errors and bugbear.
select = ["E4", "E7", "E9", "F", "B"]
