<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title id="t">Score of each hardening arm under four scoring models</title>
<desc id="d">Arms H1 to H3b are successive hardening steps of one Xen sandbox, each measured five times with Perdedor and al-khaser. The v1 formula and the weighted pass rate stay between 95 and 99 for every arm; the exposure models spread the arms from under 10 to about 60.</desc>
<style>
:root{--bg:#fcfcfb;--ink:#1f1f1e;--ink2:#5c5b55;--grid:#e4e3df;--s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#eda100;}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#c98500;}}
.bg{fill:var(--bg)} .t{fill:var(--ink);font-size:15px;font-weight:600} .a{fill:var(--ink2);font-size:12px} .g{stroke:var(--grid);stroke-width:1} .l{fill:var(--ink);font-size:12px}
</style>
<rect class="bg" width="800" height="420" rx="8"/>
