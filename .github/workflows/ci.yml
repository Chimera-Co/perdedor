# Every push and pull request: lint and test the Python packages, build the native agent for
# every target, check the Windows binaries import only system DLLs, and run each agent for real
# (Linux on Ubuntu, both Windows builds on Windows Server) against the catalog and the schema.
name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs the whole CI first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Versions agree
        run: python scripts/check_version.py
      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .
      - run: python -m pytest -q
      - name: Scoring lab (synthetic axioms)
        working-directory: research/scoring-lab
        run: python lab.py --trials 3 --out "$RUNNER_TEMP/lab"

  package:
    # The sdist and wheel must work without a checkout: install the wheel into a clean environment
    # outside the repository and score a report with the bundled catalog.
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.3.0
      - run: scripts/build_dist.sh "$RUNNER_TEMP/dist"
      - name: Install the wheel and score a report outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv clean
          clean/bin/pip install -q dist/*.whl
          printf '%s' '{"platform":"linux","findings":[{"id":"a","technique":"cpu.hypervisor_bit","status":"detected"}]}' > r.json
          clean/bin/perdedor score r.json
          clean/bin/python -c "from perdedor_common.catalog import default_catalog_dir as d; assert '_catalog' in str(d()), d()"

  native-build:
    name: Native build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe stamps the build
          persist-credentials: false
      - name: Toolchains
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends g++ make \
            g++-mingw-w64-x86-64-win32 g++-mingw-w64-i686-win32 binutils-mingw-w64
      - name: Build
        run: >
          make -C native -j"$(nproc)" linux win64 win32
          WIN64_CXX=x86_64-w64-mingw32-g++-win32 WIN32_CXX=i686-w64-mingw32-g++-win32
      - name: Core unit tests
        run: make -C native test
      - name: Linux binary is fully static
        run: file native/build/perdedor-linux-x86_64 | tee /dev/stderr | grep -q "statically linked"
      - name: Windows binaries import only DLLs that ship with Windows 7 and later
        run: |
          allowed="kernel32 advapi32 msvcrt ntdll user32 gdi32 shell32 ole32 oleaut32 ws2_32 iphlpapi setupapi
                   psapi version shlwapi powrprof cfgmgr32 dnsapi winhttp wtsapi32 netapi32 wintrust crypt32 bcrypt"
          status=0
          for exe in native/build/*.exe; do
            for dll in $(x86_64-w64-mingw32-objdump -p "$exe" | awk '/DLL Name:/ {print tolower($3)}'); do
              case " $(echo $allowed) " in
                *" ${dll%.dll} "*) ;;
                *) echo "::error file=$exe::imports $dll, which is not a stock Windows DLL"; status=1 ;;
              esac
            done
            echo "$exe: $(x86_64-w64-mingw32-objdump -p "$exe" | awk '/DLL Name:/ {printf "%s ", $3}')"
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-agents
          path: |
            native/build/perdedor-linux-x86_64
            native/build/perdedor-windows-x64.exe
            native/build/perdedor-windows-x86.exe
          if-no-files-found: error
          retention-days: 14

  native-run:
    name: Run ${{ matrix.label }}
    needs: native-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-24.04, platform: linux, binary: perdedor-linux-x86_64 }
          - { label: windows-x64, os: windows-2025, platform: windows, binary: perdedor-windows-x64.exe }
          - { label: windows-x86 (WOW64), os: windows-2025, platform: windows, binary: perdedor-windows-x86.exe }
          - { label: windows-x64 on Server 2022, os: windows-2022, platform: windows, binary: perdedor-windows-x64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-agents
          path: agents-bin
      - if: runner.os == 'Linux'
        run: chmod +x agents-bin/*
      - name: Verify against the catalog and schema (standard profile)
        shell: bash
        run: >
          python scripts/verify_native_agent.py "agents-bin/${{ matrix.binary }}"
          --platform ${{ matrix.platform }} --profile standard --label "${{ matrix.label }}"

  legacy-windows-agent:
    # The v1 PowerShell 7 agent stays as a fallback for guests the native agent cannot run in; it must
    # keep producing schema-valid reports on a real Windows host (Ubuntu covers it under pwsh in the
    # Python job, and the v1 Linux agent through the test suite).
    name: Legacy PowerShell agent (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run Invoke-Perdedor.ps1
        shell: pwsh
        run: pwsh -NoProfile -File agents/windows/Invoke-Perdedor.ps1 -OutputPath "$env:RUNNER_TEMP/windows-report.json"
      - name: Validate the report
        shell: bash
        run: |
          python - "$RUNNER_TEMP/windows-report.json" <<'PY'
          import json, sys
          sys.path.insert(0, "common/python")
          from perdedor_common.validation import validate_report
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          validate_report(report, source=sys.argv[1])
          assert report["platform"] == "windows", report["platform"]
          statuses = {}
          for f in report["findings"]:
              statuses[f["status"]] = statuses.get(f["status"], 0) + 1
          print(f"{len(report['findings'])} findings: {statuses}")
          PY

  apple-macos:
    name: macOS driver
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install and build the Python agents
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install build==1.3.0
          scripts/build_dist.sh "$RUNNER_TEMP/apple-wheel"
      - name: Test Apple transports, parsers and catalog
        run: python -m pytest -q tests/test_macos*.py tests/test_ios*.py tests/test_catalog.py
      - name: Run the macOS agent on the runner
        run: |
          python -m venv "$RUNNER_TEMP/apple-clean"
          "$RUNNER_TEMP/apple-clean/bin/pip" install --no-deps "$RUNNER_TEMP"/apple-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/apple-clean/bin/perdedor-macos" --local --no-network --output "$RUNNER_TEMP/macos-report.json"
      - name: Validate the live report
        run: |
          python - "$RUNNER_TEMP/macos-report.json" <<'PY'
          import json, sys
          from collections import Counter
          from perdedor_common.catalog import load_catalog
          from perdedor_common.registry import select
          from perdedor_common.validation import validate_report
          from perdedor_macos.runner import all_checks
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          validate_report(report, source=sys.argv[1])
          assert report["platform"] == "macos"
          findings = {f["id"]: f for f in report["findings"]}
          expected = {s.id for s in select(all_checks(), profile="standard", network=False)}
          assert set(findings) == expected, (expected - findings.keys(), findings.keys() - expected)
          catalog = load_catalog()
          for check_id, finding in findings.items():
              assert catalog.check(check_id)["technique"] == finding["technique"], check_id
          for name in ("env.hw_model", "env.cpu_count", "env.memsize", "timing.uptime"):
              finding = findings["macos." + name]
              assert finding["status"] in ("clean", "detected"), finding
          print(f"{len(findings)} catalogued findings: {dict(Counter(f['status'] for f in findings.values()))}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-report-and-wheel
          path: |
            ${{ runner.temp }}/macos-report.json
            ${{ runner.temp }}/apple-wheel/*.whl
          if-no-files-found: error
          retention-days: 14
