# Push a tag vX.Y.Z (matching every version string, see scripts/check_version.py) to publish a release:
# the full CI runs first, then the release job attaches the native agents, the Python distributions,
# the legacy PowerShell agent, a deploy bundle and SHA256SUMS, each with a signed build-provenance
# attestation (verify with: gh attestation verify <file> --repo Chimera-Co/perdedor).
# perdedor-deploy-<tag>.tar.gz is the tagged source tree (catalog, schema, every agent, native sources)
# with the three native agents already in native/build/, newer than their sources so nothing is rebuilt:
# what a host that runs scans from a checkout (CHIMERA's repo_path) installs.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag matches the version in every source
        run: python scripts/check_version.py "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-agents
          path: dist
      - name: Python distributions and the legacy PowerShell agent
        run: |
          python -m pip install build==1.3.0
          scripts/build_dist.sh dist
          (cd agents && zip -qr "../dist/perdedor-windows-ps7-agent-${GITHUB_REF_NAME}.zip" windows)
          chmod +x dist/perdedor-linux-x86_64
      - name: Deploy bundle (tagged source tree plus the native agents)
        run: |
          top="perdedor-${GITHUB_REF_NAME}"
          mkdir bundle
          git archive --prefix="${top}/" "$GITHUB_REF_NAME" | tar -x -C bundle
          mkdir -p "bundle/${top}/native/build"
          cp dist/perdedor-linux-x86_64 dist/perdedor-windows-x64.exe dist/perdedor-windows-x86.exe \
            "bundle/${top}/native/build/"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "dist/perdedor-deploy-${GITHUB_REF_NAME}.tar.gz" \
            -C bundle "$top"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Perdedor $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
